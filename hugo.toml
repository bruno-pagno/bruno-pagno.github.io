baseURL = 'https://bruno-pagno.github.io/'
locale = 'en-us'
title = "Bruno Pagno"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  env = "production"
  defaultTheme = "light"
  disableThemeToggle = false
  description = "Notes on software engineering, AI-assisted development, and building things."
  DateFormat = "Jan 2, 2006"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  comments = false

  [params.homeInfoParams]
    Title = "Bruno Pagno"
    Content = "I write about software engineering, AI and things I'm building."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/bruno-pagno"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/bruno-pagno"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = true
